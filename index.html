

<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рандомайзер</title>
    <link rel="stylesheet" href="style.css">
    <link type="Image/x-icon" href="icon/favicon.ico" rel="icon">
    <link rel="manifest" href="manifest.json">
  </head>
  <body>
    <h1>Рандомайзер</h1>
    <button id="startButton">Начать</button>
    <p>Рома тянет первый!</p>
    <div id="card-container"> <!-- Карты будут сгенерированы здесь -->
    </div>
    
    <!-- Модальное окно для ввода количества участников -->
    <div id="participantsModal" class="modal">
      <div class="modal-content"> 
        <h2>Введите количество участников:</h2> 
        <input type="number" id="numParticipants" min="1"> 
        <button id="participantsSubmit">Подтвердить</button> 
      </div>
    </div>
    
    <!-- Модальное окно для ввода количества карт "Жертва" и "Счастливчик" -->
    <div id="cardsModal" class="modal">
      <div class="modal-content"> 
        <h2>Введите количество карт:</h2> 
        <label for="numVictims">Жертва:</label>
        <input type="number" id="numVictims" min="0"><br>
        <label for="numLucky">Счастливчик:</label>
        <input type="number" id="numLucky" min="0"><br>
        <button id="cardsSubmit">Подтвердить</button>
      </div>
    </div>
    <script src="script.js"></script>
    <script src="app.js"></script>
  </body>
</html>

<!--
Как работает код:

HTML: Структура страницы, включающая заголовок, кнопку "Начать", контейнер для карт (card-container), и модальные окна для ввода данных. CSS определяет стили для внешнего вида элементов.

CSS: Задает внешний вид карточек, модальных окон, и кнопок. transition: opacity 1s ease; обеспечивает плавную смену прозрачности.

JavaScript:

Получение элементов: Получает ссылки на необходимые элементы DOM.

Переменные: numParticipants, numVictims, numLucky хранят значения, введенные пользователем.

showModal(modal) и hideModal(modal): Функции для отображения и скрытия модальных окон.

Обработчик для кнопки "Начать": Показывает модальное окно для ввода количества участников.

Обработчики для кнопок "Подтвердить" в модальных окнах:

Считывают значения из полей ввода.

Проверяют корректность введенных данных (числа, положительные значения, соответствие сумме).

Скрывают текущее модальное окно.

Вызывают функцию generateCards() для генерации карт.

generateCards():

Очищает cardContainer.

Создает массивы с типами карт ('Жертва' и 'Счастливчик') в соответствии с введенными данными.

Использует функцию shuffleArray() для случайного перемешивания массива типов карт.

В цикле создает элементы div для каждой карты, добавляет классы card, card-front, card-back.

Задает текст на задней стороне карты (тип карты).

Добавляет обработчик события click на каждую карту: при клике добавляется класс revealed, что запускает CSS-анимацию для показа задней стороны карты.

Добавляет созданные карты в cardContainer.

shuffleArray(array): Функция, реализующая алгоритм Fisher-Yates для перемешивания массива в случайном порядке.

Логика работы:

При загрузке страницы сразу показывается модальное окно для ввода количества участников.

После ввода количества участников и нажатия "Подтвердить", показывается окно для ввода количества карт "Жертва" и "Счастливчик".

После ввода данных о картах и нажатия "Подтвердить", генерируются карты и добавляются на страницу.

При нажатии на карту, она "переворачивается", показывая, является ли игрок "Жертвой" или "Счастливчиком".

Как использовать:

Сохраните код в файлы index.html, style.css, script.js (или просто скопируйте всё в один файл index.html).

Откройте index.html в вашем браузере.

Вводите количество участников и типы карт в модальных окнах.

Нажимайте на карты, чтобы их "перевернуть".

Возможные улучшения:

Более гибкая настройка: Добавить возможность выбора цветов карт, шрифтов и т.д.

Повторный запуск: Добавить кнопку "Сброс" для повторного запуска рандомизатора.

Анимации: Улучшить анимацию переворота карт (например, используя CSS-трансформации для создания 3D-эффекта).

Обработка ошибок: Добавить более подробную обработку ошибок при вводе некорректных данных.

Более информативные сообщения: Вместо просто "Жертва" и "Счастливчик" можно показывать какие-то действия или бонусы, которые получают участники.

Сохранение результатов: Добавить возможность сохранения результатов (например, в локальное хранилище браузера).

Этот код представляет собой базовую реализацию рандомайзера. Вы можете его настроить и расширить в соответствии с вашими потребностями.
-->
